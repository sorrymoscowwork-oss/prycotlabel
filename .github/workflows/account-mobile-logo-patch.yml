name: PRYCOT account mobile logo patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Temporary account mobile logo patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch account.html only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('account.html')
          s=p.read_text(encoding='utf-8')
          marker='</body>'
          add='''<script>\n(function(){\nif(!window.matchMedia('(max-width:700px)').matches)return;\nconst brand=document.querySelector('.brand');\nif(!brand)return;\nbrand.style.transition='filter .56s ease, opacity .56s ease, transform .56s ease';\nlet ticking=false;\nfunction update(){const hidden=window.scrollY>80;brand.style.filter=hidden?'blur(16px)':'blur(0)';brand.style.opacity=hidden?'0':'1';brand.style.transform=hidden?'translateY(-8px)':'translateY(0)';ticking=false;}\nwindow.addEventListener('scroll',function(){if(!ticking){window.requestAnimationFrame(update);ticking=true;}},{passive:true});\nupdate();\n})();\n</script>\n'''
          if s.count(marker)!=1: raise SystemExit('Safety stop: expected one body marker')
          if 'window.scrollY>80' in s: raise SystemExit('Safety stop: patch already exists')
          p.write_text(s.replace(marker,add+marker,1),encoding='utf-8')
          PY
          git add account.html
          git rm .github/workflows/account-mobile-logo-patch.yml
          git commit -m 'Fix mobile account logo scroll behavior'
          git push
