name: Add Friday Post Feature

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'Apply Friday post feature') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch account and public artist page
        run: |
          python3 <<'PY'
          from pathlib import Path

          account = Path('account.html')
          s = account.read_text()

          marker = '<div class="release-request"><div class="release-request-copy">'
          ui = r'''<div class="friday-post-card" id="fridayPostCard">
          <div class="friday-post-head">
          <div><div class="profile-card-title">FRIDAY POST</div><div class="profile-card-subtitle">One text post every Friday. Maximum 80 characters.</div></div>
          </div>
          <form id="fridayPostForm">
          <textarea id="fridayPostText" maxlength="80" placeholder="Write something for your public profile..." aria-label="Friday Post"></textarea>
          <div class="friday-post-footer">
          <div class="friday-post-meta"><span id="fridayPostCount">0 / 80</span><span id="fridayPostStatus"></span></div>
          <button class="primary" id="fridayPostButton" type="submit">PUBLISH</button>
          </div>
          </form>
          </div>

          '''
          if 'id="fridayPostCard"' not in s:
              if marker not in s:
                  raise SystemExit('Account release marker not found')
              s = s.replace(marker, ui + marker, 1)

          css_marker = '<style id="blog-side-menu-color">'
          css = r'''<style id="friday-post-style">
          .friday-post-card{margin-top:16px;border:1px solid var(--line);border-radius:14px;background:#101010;padding:24px}
          .friday-post-head{margin-bottom:18px}
          .friday-post-card textarea{width:100%;height:90px;min-height:90px;resize:none;border:1px solid #303030;border-radius:8px;background:#0b0b0b;color:var(--fg);padding:12px;font-size:14px;line-height:1.45;outline:none}
          .friday-post-card textarea:focus{border-color:#555}
          .friday-post-footer{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:14px}
          .friday-post-meta{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:10px;line-height:1.2}
          #fridayPostStatus{min-height:12px}
          @media(max-width:760px){.friday-post-card{padding:20px;border-radius:12px}.friday-post-footer{align-items:flex-start;flex-direction:column}.friday-post-footer .primary{align-self:flex-start}}
          </style>
          '''
          if 'id="friday-post-style"' not in s:
              s = s.replace(css_marker, css + css_marker, 1)

          js_marker = 'function friendlyError(err){'
          js = r'''
          const fridayPostForm=document.getElementById("fridayPostForm");
          const fridayPostText=document.getElementById("fridayPostText");
          const fridayPostButton=document.getElementById("fridayPostButton");
          const fridayPostStatus=document.getElementById("fridayPostStatus");
          const fridayPostCount=document.getElementById("fridayPostCount");
          function fridayDateKey(d=new Date()){
            const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");
            return `${y}-${m}-${day}`;
          }
          function updateFridayCounter(){if(fridayPostCount)fridayPostCount.textContent=`${(fridayPostText?.value||"").length} / 80`}
          function isFriday(d=new Date()){return d.getDay()===5}
          function setFridayPostState(message="",disabled=false){
            if(fridayPostStatus)fridayPostStatus.textContent=message;
            if(fridayPostButton)fridayPostButton.disabled=disabled;
            if(fridayPostText)fridayPostText.disabled=disabled;
          }
          async function loadFridayPost(user){
            if(!fridayPostForm)return;
            fridayPostText.addEventListener("input",updateFridayCounter);
            updateFridayCounter();
            const snap=await db.collection("users").doc(user.uid).get();
            const d=snap.exists?snap.data():{};
            const username=(d.username||d.displayName||"").toLowerCase().replace(/[^a-z0-9_]/g,"");
            if(!username){setFridayPostState("Set your username first.",true);return}
            const today=new Date();
            const key=fridayDateKey(today);
            const postRef=db.collection("fridayPosts").doc(`${username}_${key}`);
            const existing=await postRef.get();
            if(!isFriday(today)){
              setFridayPostState("Publishing is available on Fridays only.",true);
              return;
            }
            if(existing.exists){
              fridayPostText.value=existing.data().text||"";
              updateFridayCounter();
              setFridayPostState("Published for this Friday.",true);
              return;
            }
            setFridayPostState("",false);
          }
          if(fridayPostForm){
            fridayPostForm.addEventListener("submit",async e=>{
              e.preventDefault();
              const user=auth.currentUser;if(!user)return;
              const text=fridayPostText.value.trim();
              const now=new Date();
              if(!isFriday(now)){setFridayPostState("Publishing is available on Fridays only.",true);return}
              if(!text){setFridayPostState("Write a post first.",false);return}
              if([...text].length>80){setFridayPostState("Maximum 80 characters.",false);return}
              const profile=await db.collection("users").doc(user.uid).get();
              const data=profile.exists?profile.data():{};
              const username=(data.username||data.displayName||"").toLowerCase().replace(/[^a-z0-9_]/g,"");
              if(!username){setFridayPostState("Set your username first.",true);return}
              const key=fridayDateKey(now);
              const ref=db.collection("fridayPosts").doc(`${username}_${key}`);
              try{
                fridayPostButton.disabled=true;
                await ref.create({uid:user.uid,username,text,date:key,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
                setFridayPostState("Published for this Friday.",true);
              }catch(err){
                if(err.code==="already-exists")setFridayPostState("A Friday post has already been published.",true);
                else setFridayPostState(friendlyError(err),false);
              }
            });
          }

          '''
          if 'async function loadFridayPost(user)' not in s:
              if js_marker not in s:
                  raise SystemExit('Account JS marker not found')
              s = s.replace(js_marker, js + js_marker, 1)

          old = 'try{await loadProfile(user)}catch(err){setStatus(document.getElementById("profileStatus"),friendlyError(err),true)}'
          new = 'try{await loadProfile(user);await loadFridayPost(user)}catch(err){setStatus(document.getElementById("profileStatus"),friendlyError(err),true)}'
          s = s.replace(old,new,1)
          account.write_text(s)

          artist = Path('artist.html')
          a = artist.read_text()
          html_marker = '<footer class="site-footer">'
          html = r'''<section class="friday-public hidden" id="fridayPublic">
          <div class="friday-public-label">FRIDAY POST</div>
          <div class="friday-public-text" id="fridayPublicText"></div>
          <div class="friday-public-date" id="fridayPublicDate"></div>
          </section>
          '''
          if 'id="fridayPublic"' not in a:
              if html_marker not in a: raise SystemExit('Artist footer marker not found')
              a=a.replace(html_marker,html+html_marker,1)
          css_marker2='</style>\n<style id="canonical-menu-style">'
          css2=r'''</style>
          <style id="friday-public-style">
          .friday-public{margin:44px auto 0;max-width:560px;text-align:center;padding-top:22px;border-top:1px solid var(--line)}
          .friday-public-label{color:var(--muted);font-size:9px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:12px}
          .friday-public-text{font-size:18px;line-height:1.35;letter-spacing:-.02em;white-space:pre-wrap}
          .friday-public-date{margin-top:10px;color:var(--muted);font-size:9px;letter-spacing:.1em;text-transform:uppercase}
          @media(max-width:760px){.friday-public{margin-top:36px}.friday-public-text{font-size:16px}}
          </style>
          '''
          if 'id="friday-public-style"' not in a:
              if css_marker2 not in a: raise SystemExit('Artist CSS marker not found')
              a=a.replace(css_marker2,css2+css_marker2.split('</style>')[1],1)
          js_marker2='async function load(){'
          insert=r'''
          async function loadFridayPublic(username){
            const snap=await db.collection("fridayPosts").where("username","==",username).orderBy("date","desc").limit(1).get();
            if(snap.empty)return;
            const d=snap.docs[0].data();
            document.getElementById("fridayPublicText").textContent=d.text||"";
            document.getElementById("fridayPublicDate").textContent=d.date||"";
            document.getElementById("fridayPublic").classList.remove("hidden");
          }
          '''
          if 'async function loadFridayPublic(username)' not in a:
              if js_marker2 not in a: raise SystemExit('Artist JS marker not found')
              a=a.replace(js_marker2,insert+js_marker2,1)
          oldload='document.getElementById("profile").classList.remove("hidden");'
          a=a.replace(oldload,oldload+'\nawait loadFridayPublic(username);',1)
          if '/platforms-footer.js' not in a:
              a=a.replace('</body>','<script src="/platforms-footer.js"></script>\n</body>',1)
          artist.write_text(a)
          PY

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add account.html artist.html
          git diff --cached --quiet && exit 0
          git commit -m "Apply Friday post feature"
          git push

# Triggered after creation by the next push.
