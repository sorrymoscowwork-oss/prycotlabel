name: Safe PRYCOT cleanup — approved block

on:
  workflow_dispatch:
    inputs:
      filename:
        description: "Approved HTML file"
        required: true
        default: "how-to-release.html"
      approved_source_commit:
        description: "Exact approved source commit for the HTML file"
        required: true
        default: "d06228ab3f26eff148f7ab914c8435bd7d512b55"
      start_marker:
        description: "Exact unique start marker of the approved block"
        required: true
        default: "<script id=\"scroll-logo-hide-behavior\">"
      commit_message:
        description: "Commit message"
        required: true
        default: "Clean obsolete approved code"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove only the approved block
        shell: python
        env:
          TARGET_FILE: ${{ inputs.filename }}
          APPROVED_SOURCE_COMMIT: ${{ inputs.approved_source_commit }}
          START_MARKER: ${{ inputs.start_marker }}
        run: |
          from pathlib import Path
          import os
          import subprocess

          filename = os.environ["TARGET_FILE"]
          approved_source_commit = os.environ["APPROVED_SOURCE_COMMIT"]
          start_marker = os.environ["START_MARKER"].encode("utf-8")
          end_marker = b"</script>"

          path = Path(filename)
          original = path.read_bytes()

          approved_source = subprocess.check_output(
              ["git", "show", f"{approved_source_commit}:{filename}"]
          )
          if original != approved_source:
              raise SystemExit(
                  f"ABORT: {filename} is not the approved source version. "
                  f"It must exactly match {approved_source_commit}. Nothing will be committed."
              )

          if original.count(start_marker) != 1:
              raise SystemExit(
                  "ABORT: approved start marker did not match exactly once. Nothing will be committed."
              )

          start = original.find(start_marker)
          end = original.find(end_marker, start)
          if end == -1:
              raise SystemExit(
                  "ABORT: approved block closing marker was not found. Nothing will be committed."
              )
          end += len(end_marker)

          result = original[:start] + original[end:]

          if result == original:
              raise SystemExit(f"ABORT: {filename} was not changed. Nothing will be committed.")

          if result.count(start_marker) != 0:
              raise SystemExit(
                  "ABORT: approved block marker still exists after cleanup. Nothing will be committed."
              )

          Path(f"/tmp/{filename}.expected").write_bytes(result)
          path.write_bytes(result)
          print("Verified: exact approved source and exactly one approved block removed.")

      - name: Verify exact expected result
        shell: python
        env:
          TARGET_FILE: ${{ inputs.filename }}
        run: |
          from pathlib import Path
          import os
          import subprocess

          filename = os.environ["TARGET_FILE"]
          actual = Path(filename).read_bytes()
          expected = Path(f"/tmp/{filename}.expected").read_bytes()
          if actual != expected:
              raise SystemExit(f"ABORT: {filename} differs from the exact expected result.")

          changed = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          if changed != [filename]:
              raise SystemExit(f"ABORT: unexpected changed files: {changed}")

          print(f"Verified: only {filename} contains the exact approved cleanup.")

      - name: Commit only after all checks pass
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.filename }}"
          git commit -m "$COMMIT_MESSAGE"
          git push
