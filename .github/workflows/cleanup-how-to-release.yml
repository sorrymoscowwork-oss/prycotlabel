name: Safe PRYCOT cleanup — How to Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove only the approved How to Release fragment
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          filename = "how-to-release.html"
          approved_source_commit = "d06228ab3f26eff148f7ab914c8435bd7d512b55"

          path = Path(filename)
          original = path.read_bytes()

          approved_source = subprocess.check_output(
              ["git", "show", f"{approved_source_commit}:{filename}"]
          )
          if original != approved_source:
              raise SystemExit(
                  f"ABORT: {filename} is not the approved source version. "
                  f"It must exactly match {approved_source_commit}. Nothing will be committed."
              )

          old_script = b"const brand=document.getElementById('brand'),page=document.querySelector('.page');if(!brand||!page)return;"
          new_script = b"const page=document.querySelector('.page');if(!page)return;"

          if original.count(old_script) != 1:
              raise SystemExit(
                  "ABORT: approved obsolete brand JavaScript fragment did not match exactly once. Nothing will be committed."
              )

          result = original.replace(old_script, new_script, 1)

          if result == original:
              raise SystemExit(f"ABORT: {filename} was not changed. Nothing will be committed.")

          Path(f"/tmp/{filename}.expected").write_bytes(result)
          path.write_bytes(result)

          print("Verified: approved source version and exactly one approved obsolete JavaScript fragment.")

      - name: Verify exact expected result
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          filename = "how-to-release.html"
          actual = Path(filename).read_bytes()
          expected = Path(f"/tmp/{filename}.expected").read_bytes()
          if actual != expected:
              raise SystemExit(f"ABORT: {filename} differs from the exact expected result.")

          changed = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          if changed != [filename]:
              raise SystemExit(f"ABORT: unexpected changed files: {changed}")

          print("Verified: only how-to-release.html contains the exact approved cleanup.")

      - name: Commit only after all checks pass
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add how-to-release.html
          git commit -m "Clean obsolete How to Release code"
          git push
