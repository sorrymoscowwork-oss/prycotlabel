name: Safe PRYCOT cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove only the approved dashboard guide block
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          filename = "dashboard-guide.html"
          expected_blob = "b86a39301904bdd0b5161a737737409835413781"
          actual_blob = subprocess.check_output(["git", "hash-object", filename], text=True).strip()
          if actual_blob != expected_blob:
              raise SystemExit(
                  f"ABORT: {filename} is not the approved source version. "
                  f"Expected {expected_blob}, found {actual_blob}. Nothing will be committed."
              )

          part = b"(function(){const page=document.querySelector('.page');if(!page)return;let ticking=false;function update(){page.classList.toggle('mobile-brand-hidden',innerWidth<=700&&scrollY>80);ticking=false}addEventListener('scroll',()=>{if(!ticking){requestAnimationFrame(update);ticking=true}},{passive:true});addEventListener('resize',update);update()})();"

          path = Path(filename)
          result = path.read_bytes()
          matches = result.count(part)
          if matches != 1:
              raise SystemExit(
                  f"ABORT: {filename}, approved fragment matched {matches} times: {part!r}. Nothing will be committed."
              )

          result = result.replace(part, b"", 1)
          Path(f"/tmp/{filename}.expected").write_bytes(result)
          path.write_bytes(result)

          print("Verified: exact approved source version and exact approved fragment matched once.")

      - name: Verify exact expected result
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          filename = "dashboard-guide.html"
          actual = Path(filename).read_bytes()
          expected = Path(f"/tmp/{filename}.expected").read_bytes()
          if actual != expected:
              raise SystemExit(f"ABORT: {filename} differs from the exact expected result.")

          changed = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          if changed != [filename]:
              raise SystemExit(f"ABORT: unexpected changed files: {changed}")

          print("Verified: only dashboard-guide.html contains the exact approved change.")

      - name: Commit only after all checks pass
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard-guide.html
          git commit -m "Clean obsolete dashboard guide code"
          git push
