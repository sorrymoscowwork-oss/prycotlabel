name: Safe PRYCOT cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove only the approved blocks
        shell: python
        run: |
          from pathlib import Path

          targets = {
              "account.html": [
                  [b'<div class="menu-header"></div>'],
                  [b'.menu-header{display:flex;justify-content:flex-end}'],
              ],
              "account-auth.js": [
                  [
                      b',p=document.getElementById("profileName");',
                      b'if(p)p.value=label;',
                  ],
                  [
                      b'const oldAgreement=document.getElementById("releaseAgreement");if(oldAgreement)oldAgreement.addEventListener("change",e=>{const b=document.getElementById("submitReleaseButton");if(!b)return;const on=e.target.checked;b.classList.toggle("release-disabled",!on);b.classList.toggle("release-enabled",on);b.setAttribute("aria-disabled",String(!on));b.tabIndex=on?0:-1});',
                  ],
              ],
          }

          for filename, blocks in targets.items():
              path = Path(filename)
              original = path.read_bytes()
              result = original

              for block_number, parts in enumerate(blocks, 1):
                  for part in parts:
                      matches = result.count(part)
                      if matches != 1:
                          raise SystemExit(
                              f"ABORT: {filename}, approved block {block_number} part matched {matches} times; nothing will be committed."
                          )
                  for part in parts:
                      result = result.replace(part, b"", 1)

              expected_path = Path(f"/tmp/{filename}.expected")
              expected_path.parent.mkdir(parents=True, exist_ok=True)
              expected_path.write_bytes(result)
              path.write_bytes(result)

          print("Verified: all approved account cleanup blocks were matched exactly once.")

      - name: Verify exact expected result
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          for filename in ["account.html", "account-auth.js"]:
              actual = Path(filename).read_bytes()
              expected = Path(f"/tmp/{filename}.expected").read_bytes()
              if actual != expected:
                  raise SystemExit(f"ABORT: {filename} differs from the exact expected result.")

          changed = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          if changed != ["account-auth.js", "account.html"]:
              raise SystemExit(f"ABORT: unexpected changed files: {changed}")

          print("Verified: only account.html and account-auth.js contain the exact approved changes.")

      - name: Commit only after all checks pass
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add account.html account-auth.js
          git commit -m "Clean obsolete account code"
          git push
