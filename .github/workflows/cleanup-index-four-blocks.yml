name: Clean index four legacy blocks

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove only the four approved legacy blocks
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("index.html")
          original = path.read_bytes()
          text = original.decode("utf-8")

          patterns = [
              rb'<style>\s*\.brand\{position:fixed!important;top:30px!important;left:34px!important;z-index:9!important\}\s*@media\(max-width:700px\)\{\.brand\{top:22px!important;left:20px!important\}\}\s*</style>',
              rb'<style id="uniform-menu-style">.*?</style>',
              rb'<style id="active-menu-item">.*?</style>',
              rb'<style id="home-button-style">.*?</style>',
          ]

          result = original
          for i, pattern in enumerate(patterns, 1):
              matches = re.findall(pattern, result, flags=re.S)
              if len(matches) != 1:
                  raise SystemExit(f"ABORT: approved block {i} matched {len(matches)} times; nothing will be committed.")
              result = re.sub(pattern, b"", result, count=1, flags=re.S)

          if result == original:
              raise SystemExit("ABORT: no change produced.")

          Path("/tmp/index.expected").write_bytes(result)
          path.write_bytes(result)
          print("Verified: exactly four approved blocks removed from the original byte content.")

      - name: Verify result is exactly the expected four-block removal
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          expected = Path("/tmp/index.expected").read_bytes()
          actual = Path("index.html").read_bytes()

          if actual != expected:
              raise SystemExit("ABORT: index.html differs from the exact expected result.")

          changed = subprocess.check_output(
              ["git", "diff", "--name-only"], text=True
          ).splitlines()
          if changed != ["index.html"]:
              raise SystemExit(f"ABORT: unexpected changed files: {changed}")

          print("Verified: index.html is byte-for-byte identical to the expected four-block removal, and it is the only changed file.")

      - name: Commit only after all checks pass
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Clean four obsolete index CSS blocks"
          git push
