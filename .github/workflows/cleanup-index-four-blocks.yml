name: Safe PRYCOT cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove only the approved Terms page block
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          filename = "terms.html"
          expected_blob = "12950f1a0cd2175eeffde990013d5e25c8beed05"
          actual_blob = subprocess.check_output(["git", "hash-object", filename], text=True).strip()
          if actual_blob != expected_blob:
              raise SystemExit(
                  f"ABORT: {filename} is not the approved source version. "
                  f"Expected {expected_blob}, found {actual_blob}. Nothing will be committed."
              )

          path = Path(filename)
          original = path.read_bytes()

          old_brand = b'<a class="brand" id="brand" href="index.html" aria-label="PRYCOT.">'
          new_brand = b'<a class="brand" href="index.html" aria-label="PRYCOT.">'
          if original.count(old_brand) != 1:
              raise SystemExit("ABORT: approved brand id fragment did not match exactly once.")

          result = original.replace(old_brand, new_brand, 1)

          old_script = b"const brand=document.getElementById('brand'),page=document.querySelector('.page');if(!brand||!page)return;"
          new_script = b"const page=document.querySelector('.page');if(!page)return;"
          if result.count(old_script) != 1:
              raise SystemExit("ABORT: approved JavaScript fragment did not match exactly once.")

          result = result.replace(old_script, new_script, 1)

          if result == original:
              raise SystemExit(f"ABORT: {filename} was not changed.")

          Path(f"/tmp/{filename}.expected").write_bytes(result)
          path.write_bytes(result)

          print("Verified: exact approved source version and both approved fragments matched exactly once.")

      - name: Verify exact expected result
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          filename = "terms.html"
          actual = Path(filename).read_bytes()
          expected = Path(f"/tmp/{filename}.expected").read_bytes()
          if actual != expected:
              raise SystemExit(f"ABORT: {filename} differs from the exact expected result.")

          changed = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          if changed != [filename]:
              raise SystemExit(f"ABORT: unexpected changed files: {changed}")

          print("Verified: only terms.html contains the exact approved cleanup.")

      - name: Commit only after all checks pass
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add terms.html
          git commit -m "Clean obsolete Terms page code"
          git push
