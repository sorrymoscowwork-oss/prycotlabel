name: Safe PRYCOT cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove only the approved About page blocks
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import re
          import subprocess

          filename = "about.html"
          expected_blob = "1d8e99e0e48983d76e9bdeda6659a263b206033e"
          actual_blob = subprocess.check_output(["git", "hash-object", filename], text=True).strip()
          if actual_blob != expected_blob:
              raise SystemExit(
                  f"ABORT: {filename} is not the approved source version. "
                  f"Expected {expected_blob}, found {actual_blob}. Nothing will be committed."
              )

          approved_ids = [
              "global-header-position",
              "uniform-menu-style",
              "active-menu-item",
              "home-button-style",
              "active-menu-brown",
              "mobile-menu-spacing-divider-final",
              "mobile-menu-divider-spacing-final",
              "scroll-logo-hide-style",
              "mobile-burger-close-final",
              "mobile-hide-eyebrow",
          ]

          path = Path(filename)
          original = path.read_bytes()
          result = original

          for style_id in approved_ids:
              pattern = re.compile(
                  rb'<style id="' + re.escape(style_id.encode()) + rb'">.*?</style>',
                  re.DOTALL,
              )
              matches = pattern.findall(result)
              if len(matches) != 1:
                  raise SystemExit(
                      f"ABORT: {filename}, approved block {style_id!r} matched "
                      f"{len(matches)} times. Nothing will be committed."
                  )
              result = pattern.sub(b"", result, count=1)

          if result == original:
              raise SystemExit(f"ABORT: {filename} was not changed.")

          Path(f"/tmp/{filename}.expected").write_bytes(result)
          path.write_bytes(result)

          print("Verified: exact approved source version and all 10 approved blocks matched exactly once.")

      - name: Verify exact expected result
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          filename = "about.html"
          actual = Path(filename).read_bytes()
          expected = Path(f"/tmp/{filename}.expected").read_bytes()
          if actual != expected:
              raise SystemExit(f"ABORT: {filename} differs from the exact expected result.")

          changed = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          if changed != [filename]:
              raise SystemExit(f"ABORT: unexpected changed files: {changed}")

          print("Verified: only about.html contains the exact approved cleanup.")

      - name: Commit only after all checks pass
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about.html
          git commit -m "Clean obsolete About page code"
          git push
