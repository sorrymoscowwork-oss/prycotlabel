name: Fix Telegram login widget

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-telegram-widget.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch widget loading
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('account.html')
          text = path.read_text()

          old = '<script async src="https://telegram.org/js/telegram-widget.js?22" data-telegram-login="prycot_relese_bot" data-size="large" data-userpic="false" data-onauth="onTelegramAuth(user)" data-request-access="write"></script>'
          new = '''<script>
          (function(){
            function mountTelegramWidget(){
              const container=document.getElementById("telegramLoginWidget");
              if(!container || container.dataset.mounted)return;
              container.dataset.mounted="1";
              const script=document.createElement("script");
              script.src="https://telegram.org/js/telegram-widget.js?22";
              script.async=true;
              script.setAttribute("data-telegram-login","prycot_relese_bot");
              script.setAttribute("data-size","large");
              script.setAttribute("data-userpic","false");
              script.setAttribute("data-onauth","onTelegramAuth(user)");
              script.setAttribute("data-request-access","write");
              container.appendChild(script);
            }
            if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",mountTelegramWidget);
            else mountTelegramWidget();
          })();
          </script>'''

          if old not in text:
              raise SystemExit('Telegram widget script not found')

          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit and remove installer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add account.html .github/workflows/fix-telegram-widget.yml
          git commit -m 'Fix Telegram login widget loading'
          git rm .github/workflows/fix-telegram-widget.yml
          git commit -m 'Remove Telegram widget installer'
          git push
