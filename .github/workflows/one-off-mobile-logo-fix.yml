name: One-off mobile logo fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply mobile logo fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('user-agreement.html')
          text = path.read_text(encoding='utf-8')
          old = '<style id="desktop-logo-overflow-fix">@media(min-width:701px){.logo{width:max-content!important;max-width:none!important;overflow:visible!important;white-space:nowrap!important;padding-right:9px!important;margin-right:-6px!important;box-sizing:content-box!important}}</style>'
          new = old + '\n<style id="mobile-logo-overflow-fix">@media(max-width:700px){.logo{width:max-content!important;max-width:none!important;overflow:visible!important;white-space:nowrap!important;padding-right:9px!important;margin-right:-6px!important;box-sizing:content-box!important}}</style>'
          if old not in text:
              raise SystemExit('Target desktop logo rule not found; no changes made.')
          if 'id="mobile-logo-overflow-fix"' in text:
              raise SystemExit('Mobile logo fix already exists; no changes needed.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit site change and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-off-mobile-logo-fix.yml
          git add user-agreement.html
          git commit -m "Fix mobile User Agreement logo overflow"
          git push
