name: One-time Telegram login fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix Telegram login bot'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Switch account login to the dedicated account bot
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('account.html')
          s = p.read_text(encoding='utf-8')
          old = 'data-telegram-login="prycot_relese_bot"'
          new = 'data-telegram-login="prycot_account_bot"'
          if old not in s:
              raise SystemExit('Expected Telegram login widget was not found; no changes made.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/one-time-telegram-login-fix.yml

      - name: Commit only the login fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add account.html .github/workflows/one-time-telegram-login-fix.yml
          git commit -m "Fix Telegram login bot"
          git push
