name: PRYCOT one-time logo patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Temporary PRYCOT logo patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch only the desktop logo rule in the two requested files
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [Path('user-agreement.html'), Path('white-paper.html')]
          old = '@media(min-width:701px){.logo{width:max-content!important;max-width:none!important;overflow:visible!important;white-space:nowrap!important;padding-right:6px!important;margin-right:-6px!important;box-sizing:content-box!important}}'
          new = '@media(min-width:701px){.logo{width:max-content!important;max-width:none!important;overflow:visible!important;white-space:nowrap!important;padding-right:9px!important;margin-right:-6px!important;box-sizing:content-box!important}}'

          for path in files:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Safety stop: {path} contains {count} exact desktop logo rules; expected exactly 1.')
              patched = text.replace(old, new)
              if patched.count(old) != 0 or patched.count(new) != 1:
                  raise SystemExit(f'Safety stop: verification failed for {path}.')
              path.write_text(patched, encoding='utf-8')
          PY

      - name: Commit only the requested change and remove this temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add user-agreement.html white-paper.html
          git rm .github/workflows/prycot-logo-patch.yml
          git diff --cached --check
          git diff --cached -- user-agreement.html white-paper.html
          git commit -m 'Fix logo right-side clipping on User Agreement and White Paper'
          git push
