name: PRYCOT one-time White Paper mobile logo fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Temporary White Paper mobile logo patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add only mobile logo blur CSS
        run: |
          echo '' | base64 -d > /tmp/prycot-mobile-logo.css
          python3 -c "from pathlib import Path; p=Path('white-paper.html'); t=p.read_text(encoding='utf-8'); payload=Path('/tmp/prycot-mobile-logo.css').read_text(); assert 'id=\"mobile-brand-scroll-fix\"' not in t; assert '</body>' in t; p.write_text(t.replace('</body>',payload+'</body>',1),encoding='utf-8')"
      - name: Commit only White Paper and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add white-paper.html
          git rm .github/workflows/prycot-white-paper-mobile-logo.yml
          git diff --cached --check
          git diff --cached -- white-paper.html
          git commit -m 'Fix White Paper mobile logo scroll behavior'
          git push
