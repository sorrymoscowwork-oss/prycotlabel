<script>
firebase.initializeApp({apiKey:"AIzaSyCrU93d-F-WUX4GbuoPSFgdf9bOgSbQlBY",authDomain:"prycot-fe79e.firebaseapp.com",projectId:"prycot-fe79e",storageBucket:"prycot-fe79e.firebasestorage.app",messagingSenderId:"566283099923",appId:"1:566283099923:web:b42c4eea5ca42e4144c4e6"});
const db=firebase.firestore();
const match=location.pathname.match(/^\/artist\.([a-z0-9_]{3,20})\/?$/i);
const username=match?match[1].toLowerCase():"";
document.title=username||"PRYCOT.";
function initials(name){return(name||"A").trim().split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase()||"A"}
async function load(){
if(!username){document.getElementById("notFound").style.display="block";return}
try{
const snap=await db.collection("publicProfiles").doc(username).get();
if(!snap.exists||snap.data().public!==true){document.getElementById("notFound").style.display="block";return}
const d=snap.data();
document.getElementById("name").textContent=d.displayName||username;
document.getElementById("bio").textContent=d.bio||"";
document.getElementById("avatar").textContent=initials(d.displayName||username);
if(d.telegram){
const t=d.telegram.startsWith("@")?d.telegram.slice(1):d.telegram;
document.getElementById("telegram").href="https://t.me/"+encodeURIComponent(t);
document.getElementById("telegram").textContent="Telegram: "+d.telegram;
}else document.getElementById("telegram").style.display="none";
document.getElementById("profile").style.display="block";
}catch(e){document.getElementById("notFound").style.display="block"}
}
load();
</script>
<script id="scroll-logo-hide-behavior">
(function(){
  const brand=document.querySelector('.brand');
  if(!brand)return;
  let ticking=false;
  function updateLogo(){
    if(window.innerWidth>700){brand.classList.remove('logo-hidden');ticking=false;return}if(window.innerWidth>700){brand.classList.remove('logo-hidden');ticking=false;return}const hidden=window.scrollY>80;
    brand.classList.toggle('logo-hidden',hidden);
    ticking=false;
  }
  window.addEventListener('scroll',function(){
    if(!ticking){
      window.requestAnimationFrame(updateLogo);
      ticking=true;
    }
  },{passive:true});
  updateLogo();
})();
</script><script id="mobile-logo-tagline-scroll-final-js">(function(){const brand=document.querySelector('.brand'),tagline=document.querySelector('.tagline');if(!brand||!tagline)return;const page=document.querySelector('.page')||document.body;let ticking=false;function update(){if(innerWidth>700){page.classList.remove('mobile-brand-hidden');ticking=false;return}page.classList.toggle('mobile-brand-hidden',scrollY>80);ticking=false}addEventListener('scroll',function(){if(!ticking){requestAnimationFrame(update);ticking=true}},{passive:true});addEventListener('resize',update);update()})();</script>
