<style>
:root{--bg:#0a0a0a;--fg:#f4f4f2;--muted:#9b9b98;--line:#292929;--accent:#A0522D;--accent-hover:#FF7F50;--error:#d97878}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit}
.page{min-height:100vh;padding:30px 34px 50px}.brand{font-size:clamp(34px,4.5vw,62px);line-height:.82;font-weight:800;font-style:italic;letter-spacing:-.075em}.tag{margin:12px 0 0;color:var(--muted);font-size:9px;letter-spacing:.11em;text-transform:uppercase}.top{display:flex;justify-content:space-between;align-items:flex-start}.logout{border:1px solid #3a3a3a;border-radius:999px;background:transparent;color:var(--fg);padding:9px 18px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.logout:hover{border-color:var(--fg)}
main{max-width:1180px;margin:14vh auto 0}.eyebrow{margin:0 0 18px;color:var(--muted);font-size:10px;letter-spacing:.14em;text-transform:uppercase}h1{margin:0;font-size:clamp(42px,6vw,78px);line-height:.96;font-weight:500;letter-spacing:-.05em}.status{margin:22px 0;color:var(--muted);font-size:12px}.status.error{color:var(--error)}.hidden{display:none!important}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:42px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 0}.count{color:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase}.refresh{border:0;border-radius:999px;background:var(--accent);color:#fff;padding:9px 18px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.refresh:hover{background:var(--accent-hover);color:#000}
.request{border-bottom:1px solid var(--line);padding:24px 0}.request-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.title{font-size:20px;letter-spacing:-.02em}.meta{margin-top:8px;color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase}.body{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:20px}.label{color:var(--muted);font-size:9px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:7px}.value{font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word}.controls{margin-top:22px;display:flex;gap:10px;align-items:center}.controls select{border:1px solid #3a3a3a;border-radius:999px;background:#0a0a0a;color:var(--fg);padding:8px 14px;font-size:10px;letter-spacing:.08em;text-transform:uppercase}.save{border:0;border-radius:999px;background:var(--accent);color:#fff;padding:9px 18px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.save:hover{background:var(--accent-hover);color:#000}.empty{padding:30px 0;color:var(--muted);font-size:13px}
@media(max-width:700px){.page{padding:22px 20px}.top{gap:20px}.brand{font-size:42px}.body{grid-template-columns:1fr}.request-head{flex-direction:column}main{margin-top:12vh}}
</style>
<style id="canonical-menu-style">
.menu-links{align-items:flex-start!important;text-align:left!important;gap:18px!important}
.menu-links a{font-size:18px!important;line-height:1.1!important;letter-spacing:-.02em!important;font-weight:500!important;color:#f4f4f2!important;font-style:normal!important}
.menu-links a:nth-child(1),.menu-links a:nth-child(2),.menu-links a:nth-child(11),.menu-links a:nth-child(12){color:#A0522D!important}
.menu-links a:hover{color:#FF7F50!important;opacity:1!important}
.menu-links a.active-page{font-style:italic!important}
@media(max-width:700px){.menu-links a{font-size:18px!important}}
</style><style id="canonical-menu-layout">
.menu{position:fixed;inset:0 0 0 auto;z-index:10;display:none;width:min(33.333vw,520px);background:rgba(10,10,10,.22);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-left:1px solid rgba(244,244,242,.16);padding:30px 34px 42px}
.menu.open{display:flex;flex-direction:column}
.menu-links{flex:1;display:flex;flex-direction:column;justify-content:center}
.menu-button{position:fixed;top:28px;right:34px;width:28px;height:22px;border:0;background:none;color:#f4f4f2;padding:0;z-index:21;cursor:pointer}
.menu-button span,.menu-button span:before,.menu-button span:after{position:absolute;left:0;width:28px;height:1px;background:#f4f4f2;content:""}
.menu-button span{top:10px}.menu-button span:before{top:-7px}.menu-button span:after{top:7px}
@media(max-width:700px){.menu{inset:0;width:100%;padding:22px 20px 30px}.menu-button{top:20px;right:20px}}
</style><style id="active-menu-brown">.menu-links a.active-page{color:#A0522D!important;font-style:italic!important}.menu-links a.active-page:hover{color:#FF7F50!important}</style><style id="desktop-two-column-menu">
.menu-links{
  display:grid!important;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;
  column-gap:42px!important;
  align-items:center!important;
  justify-content:initial!important;
  text-align:left!important;
}
.menu-column{
  display:flex!important;
  flex-direction:column!important;
  align-items:flex-start!important;
  justify-content:center!important;
  gap:18px!important;
}
.menu-links a{
  font-size:18px!important;
  line-height:1.1!important;
  letter-spacing:-.02em!important;
  font-weight:500!important;
  color:#f4f4f2!important;
  font-style:normal!important;
}
.menu-left a:nth-child(1),
.menu-left a:nth-child(2),
.menu-right a{
  color:#A0522D!important;
}
.menu-links a:hover{
  color:#FF7F50!important;
  opacity:1!important;
}
.menu-links a.active-page{
  color:#A0522D!important;
  font-style:italic!important;
}
.menu-links a.active-page:hover{color:#FF7F50!important}
@media(max-width:700px){
  .menu-links{
    display:flex!important;
    flex-direction:column!important;
    align-items:flex-start!important;
    justify-content:center!important;
    gap:0!important;
    text-align:left!important;
  }
  .menu-column{
    display:flex!important;
    flex-direction:column!important;
    align-items:flex-start!important;
    justify-content:flex-start!important;
    gap:18px!important;
  }
  .menu-right{margin-top:18px!important}
  .menu-links a{font-size:18px!important}
}
</style><style id="universal-utility-button-style">
button:not(.menu-button),.site-button,.release-cta a,.release-button,.label-button,.label-services-cta a,.order-button,.download-doc,.telegram-cta span,.cta a{
display:inline-block!important;padding:9px 18px!important;border:0!important;border-radius:999px!important;background:#A0522D!important;color:#fff!important;font:400 10px/1 Helvetica,Arial,sans-serif!important;letter-spacing:.08em!important;text-transform:uppercase!important;text-decoration:none!important;cursor:pointer!important;transition:background .2s ease,color .2s ease!important}
button:not(.menu-button):hover,.site-button:hover,.release-cta a:hover,.release-button:hover,.label-button:hover,.label-services-cta a:hover,.order-button:hover,.download-doc:hover,.telegram-cta span:hover,.cta a:hover{background:#FF7F50!important;color:#000!important}
</style>
<style id="secondary-menu-white-final">
.menu-links .menu-right a,
.menu-links .menu-right a:nth-child(1),
.menu-links .menu-right a:nth-child(2),
.menu-links .menu-right a:nth-child(3),
.menu-links .menu-right a:nth-child(4){color:#f4f4f2!important;font-style:normal!important}
.menu-links .menu-right a:hover{color:#FF7F50!important;font-style:normal!important}
.menu-links .menu-right a.active-page{color:#A0522D!important;font-style:italic!important}
.menu-links .menu-right a.active-page:hover{color:#FF7F50!important}
</style><style id="mobile-menu-half-page-final">
@media(max-width:700px){
  .menu{
    width:50vw!important;
    max-width:50vw!important;
    min-width:0!important;
    padding:22px 14px 28px!important;
  }
  .menu-links{
    width:100%!important;
    gap:12px!important;
  }
  .menu-column{
    width:100%!important;
    gap:12px!important;
  }
  .menu-right{margin-top:12px!important}
  .menu-links a{
    width:100%!important;
    font-size:13px!important;
    line-height:1.05!important;
    letter-spacing:-.015em!important;
    white-space:nowrap!important;
  }
}

<body>
<div class="page">
<header class="top">
<div><a class="brand" href="/">PRYCOT.</a><div class="tag">ADMIN / RELEASE REQUESTS</div></div>
<button class="logout" id="logout">Log Out</button>
</header>
<main id="adminView" class="hidden">
<p class="eyebrow">PRYCOT. / ADMIN</p>
<h1>Release requests.</h1>
<div class="status" id="status"></div>
<div class="toolbar"><span class="count" id="count">0 requests</span><button class="refresh" id="refresh">Refresh</button></div>
<div id="requests"></div>
</main>
<div class="status" id="loading">Checking access...</div>
</div>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
 apiKey:"AIzaSyCrU93d-F-WUX4GbuoPSFgdf9bOgSbQlBY",
 authDomain:"prycot-fe79e.firebaseapp.com",
 projectId:"prycot-fe79e",
 storageBucket:"prycot-fe79e.firebasestorage.app",
 messagingSenderId:"566283099923",
 appId:"1:566283099923:web:b42c4eea5ca42e4144c4e6"
});
const auth=firebase.auth(),db=firebase.firestore();
const loading=document.getElementById("loading"),view=document.getElementById("adminView"),status=document.getElementById("status"),list=document.getElementById("requests");

function setStatus(t,e=false){status.textContent=t;status.classList.toggle("error",e)}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}
function dateValue(ts){return ts?.toDate?ts.toDate().toLocaleString("en-GB"):"—"}

async function checkAdmin(user){
 const snap=await db.collection("admins").doc(user.uid).get();
 if(!snap.exists)throw new Error("ADMIN_ACCESS_DENIED");
}

async function loadRequests(){
 setStatus("Loading...");
 try{
  const snap=await db.collection("releaseRequests").get();
  const items=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
  document.getElementById("count").textContent=items.length+" request"+(items.length===1?"":"s");
  if(!items.length){list.innerHTML='<div class="empty">No release requests.</div>';setStatus("");return}
  list.innerHTML=items.map(r=>`
   <article class="request">
    <div class="request-head"><div><div class="title">${escapeHtml(r.title||"Untitled")}</div><div class="meta">${escapeHtml(r.type||"")} · ${escapeHtml(String(r.tracks||""))} tracks · ${dateValue(r.createdAt)}</div></div></div>
    <div class="body">
      <div><div class="label">Artist / Name</div><div class="value">${escapeHtml(r.artist)}</div></div>
      <div><div class="label">Email</div><div class="value">${escapeHtml(r.email)}</div></div>
      <div><div class="label">Telegram</div><div class="value">${escapeHtml(r.telegram)}</div></div>
      <div><div class="label">Message / Comment</div><div class="value">${escapeHtml(r.message||"—")}</div></div>
    </div>
    <div class="controls">
      <select data-status="${r.id}">
       <option value="new" ${r.status==="new"?"selected":""}>New</option>
       <option value="in_review" ${r.status==="in_review"?"selected":""}>In review</option>
       <option value="approved" ${r.status==="approved"?"selected":""}>Approved</option>
       <option value="rejected" ${r.status==="rejected"?"selected":""}>Rejected</option>
       <option value="released" ${r.status==="released"?"selected":""}>Released</option>
      </select>
      <button class="save" data-save="${r.id}">Save Status</button>
    </div>
   </article>`).join("");
  list.querySelectorAll("[data-save]").forEach(btn=>btn.onclick=async()=>{
   const id=btn.dataset.save,select=list.querySelector('[data-status="'+id+'"]');
   btn.disabled=true;
   try{await db.collection("releaseRequests").doc(id).update({status:select.value});setStatus("Status saved.");}
   catch(e){setStatus(e.message||"Could not save status.",true)}
   finally{btn.disabled=false}
  });
  setStatus("");
 }catch(e){setStatus(e.message||"Could not load requests.",true)}
}

auth.onAuthStateChanged(async user=>{
 if(!user){location.href="account.html";return}
 try{
  await checkAdmin(user);
  loading.classList.add("hidden");view.classList.remove("hidden");await loadRequests();
 }catch(e){loading.textContent="Access denied.";setStatus((e.code||"ERROR")+": "+(e.message||"This account is not an admin."),true)}
});
document.getElementById("refresh").onclick=loadRequests;
document.getElementById("logout").onclick=()=>auth.signOut();
</script>

</div>
</nav></div><button class="menu-button" id="menuButton" type="button" aria-label="Open menu" aria-expanded="false"><span></span></button><script id="canonical-menu-behavior">
const menu=document.getElementById('menu'),menuButton=document.getElementById('menuButton');
if(menu&&menuButton){
 const closeMenu=()=>{menu.classList.remove('open');menuButton.setAttribute('aria-expanded','false')};
 menuButton.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();menu.classList.toggle('open');menuButton.setAttribute('aria-expanded',menu.classList.contains('open'))});
 document.addEventListener('click',e=>{if(menu.classList.contains('open')&&!menu.contains(e.target)&&e.target!==menuButton)closeMenu()});
}
document.querySelectorAll('.menu-links a').forEach(link=>{
 const current=(location.pathname.split('/').pop()||'index.html').toLowerCase();
 const target=(link.getAttribute('href').split('/').pop()||'index.html').toLowerCase();
 if((current==='index.html'&&target==='index.html')||current===target) link.classList.add('active-page');
});
</script></body>
</html>
