<!doctype html>
<html lang="en">
<head>
<!-- Desktop header cleanup: hide legacy controls before first paint -->
<style id="prycot-desktop-legacy-header-cleanup">@media (min-width: 1000px) { .menu-button, #menuButton, header .desktop-account, header .account-label, header a[href="account.html"], header a[href="/account.html"] { display: none !important; visibility: hidden !important; opacity: 0 !important; pointer-events: none !important; } .menu, .menu.open { display: none !important; visibility: hidden !important; pointer-events: none !important; } }</style>

<meta charset="utf-8">

<title>PRYCOT. — Admin</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#0a0a0a;--fg:#F4F4F4;--muted:#9B9B9B;--line:#292929;--accent:#666666;--hover:#B8B8B8;--error:#959595}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}button,input,select{font:inherit}.page{min-height:100vh;padding:30px 34px 50px}.brand{position:fixed;top:30px;left:34px;z-index:20;font-size:clamp(34px,4.5vw,62px);line-height:.82;font-weight:800;font-style:italic;letter-spacing:-.075em}.brand a{color:inherit;text-decoration:none}.tag{margin-top:72px;color:var(--muted);font-size:9px;letter-spacing:.11em;text-transform:uppercase}.logout{position:fixed;top:28px;right:34px;border:1px solid #3a3a3a;border-radius:999px;background:transparent;color:var(--fg);padding:9px 18px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.logout:hover{border-color:var(--fg)}main{max-width:1180px;margin:18vh auto 0}h1{margin:0;font-size:clamp(42px,6vw,78px);line-height:.96;font-weight:500;letter-spacing:-.05em}.eyebrow{margin:0 0 18px;color:var(--muted);font-size:10px;letter-spacing:.14em;text-transform:uppercase}.status{min-height:20px;margin:20px 0;color:var(--muted);font-size:12px}.error{color:var(--error)}.hidden{display:none!important}.login{max-width:460px;margin-top:36px;border-top:1px solid var(--line);padding-top:24px}.login label{display:block;margin-bottom:10px;color:var(--muted);font-size:10px;letter-spacing:.14em;text-transform:uppercase}.login input{width:100%;border:0;border-bottom:1px solid #3a3a3a;background:transparent;color:var(--fg);padding:11px 0;font-size:15px;outline:none}.login input:focus{border-color:var(--fg)}.button{margin-top:22px;border:0;border-radius:999px;background:var(--accent);color:#fff;padding:9px 18px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.button:hover{background:var(--hover);color:#000}.tabs{display:flex;gap:28px;margin-top:38px;border-bottom:1px solid var(--line)}.tab{border:0;border-bottom:2px solid transparent;border-radius:0!important;background:transparent;color:#777;padding:14px 0 12px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}.tab.active{color:var(--fg);border-bottom-color:var(--accent)}.tab:hover{color:var(--fg)}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:0;border-bottom:1px solid var(--line);padding:16px 0}.count{color:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase}.prycotlink-url{display:inline-block;margin-top:12px;color:var(--fg);font-size:11px;letter-spacing:.04em;text-decoration:underline;text-decoration-color:#555;text-underline-offset:4px}.prycotlink-url:hover{color:var(--hover)}.analytics-total{display:flex;align-items:baseline;gap:14px;padding:22px 0;border-bottom:1px solid var(--line)}.analytics-total strong{font-size:34px;line-height:1;font-weight:500;letter-spacing:-.04em}.analytics-total span{color:var(--muted);font-size:10px;letter-spacing:.13em;text-transform:uppercase}.request{border-bottom:1px solid var(--line);padding:24px 0}.request-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.title{font-size:20px;letter-spacing:-.02em}.meta{margin-top:8px;color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase}.body{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 40px;margin-top:20px}.label{color:var(--muted);font-size:9px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:7px}.value{font-size:13px;line-height:1.5;word-break:break-word}.controls{margin-top:22px;display:flex;gap:10px;align-items:center}.controls select{border:1px solid #3a3a3a;border-radius:999px;background:#0a0a0a;color:var(--fg);padding:8px 14px;font-size:10px;letter-spacing:.08em;text-transform:uppercase}.save{border:0;border-radius:999px;background:var(--accent);color:#fff;padding:9px 18px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.save:hover{background:var(--hover);color:#000}.delete{border:1px solid #4D4D4D;border-radius:999px!important;background:transparent;color:#AEAEAE;padding:9px 16px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.delete:hover{background:#4D4D4D;color:#fff}.delete:disabled{opacity:.5;cursor:wait}.empty{padding:30px 0;color:var(--muted);font-size:13px}.site-footer{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:80px;padding-top:22px;border-top:1px solid var(--line);color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase}@media(max-width:700px){.page{padding:22px 20px}.brand{top:22px;left:20px;font-size:42px}.logout{top:20px;right:20px}.tag{margin-top:48px}.body{grid-template-columns:1fr}.request-head{flex-direction:column}main{margin-top:15vh}.site-footer{margin-top:56px;padding-top:18px;font-size:8px;white-space:nowrap}.controls{flex-wrap:wrap}}

/* Unified pill shape for interactive buttons across desktop and mobile */
button:not(.menu-button),input[type="submit"],input[type="button"],.primary,.secondary,[class*="btn"],[class*="button"]:not(.menu-button),[class*="cta"]{border-radius:999px!important}.menu-button{border-radius:0!important}

/* Organic metric colors for PRYCOT admin analytics; keep the rest of the admin interface monochrome. */
:root{--metric-visitors:#9db7a0;--metric-streaming:#8eafba;--metric-social:#d3a08d;--metric-panel-visitors:#151c16;--metric-panel-streaming:#141b1e;--metric-panel-social:#1d1715}
#prycotlinkStats{border-bottom-color:#405344}
#prycotlinkStats strong{color:var(--metric-visitors)}
#prycotlinkStats span{color:#b5c7b7}
#tabLinks.active{border-bottom-color:var(--metric-visitors);color:var(--metric-visitors)}
#prycotlinks .request{border-bottom-color:#303a32}
#prycotlinks .request:nth-child(3n+1) .title{color:var(--metric-visitors)}
#prycotlinks .request:nth-child(3n+2) .title{color:var(--metric-streaming)}
#prycotlinks .request:nth-child(3n) .title{color:var(--metric-social)}
#prycotlinks .request:nth-child(3n+1) .request-head{border-left:2px solid #405344;padding-left:12px}
#prycotlinks .request:nth-child(3n+2) .request-head{border-left:2px solid #354d54;padding-left:12px}
#prycotlinks .request:nth-child(3n) .request-head{border-left:2px solid #574238;padding-left:12px}
#prycotlinks .prycotlink-url{ text-decoration-color:#526a56}
#prycotlinks .request:nth-child(3n+1) .prycotlink-url{color:var(--metric-visitors)}
#prycotlinks .request:nth-child(3n+2) .prycotlink-url{color:var(--metric-streaming);text-decoration-color:#49646b}
#prycotlinks .request:nth-child(3n) .prycotlink-url{color:var(--metric-social);text-decoration-color:#765648}

/* Matching organic palette for Bot Releases; color-only styling. */
#tabBot.active{border-bottom-color:var(--metric-visitors);color:var(--metric-visitors)}
#releases .request{border-bottom-color:#303a32}
#releases .request:nth-child(3n+1) .title{color:var(--metric-visitors)}
#releases .request:nth-child(3n+2) .title{color:var(--metric-streaming)}
#releases .request:nth-child(3n) .title{color:var(--metric-social)}
#releases .request:nth-child(3n+1) .request-head{border-left:2px solid #405344;padding-left:12px}
#releases .request:nth-child(3n+2) .request-head{border-left:2px solid #354d54;padding-left:12px}
#releases .request:nth-child(3n) .request-head{border-left:2px solid #574238;padding-left:12px}
#releases .request .save{background:#405344}
#releases .request .save:hover{background:#526a56;color:#fff}
#releases .request .delete{border-color:#b94b43;background:#b8322b;color:#fff}
#releases .request .delete:hover{border-color:#e05249;background:#e05249;color:#fff}
#releases .request .delete:disabled{opacity:.55}
#prycotlinks .request .delete{border-color:#b94b43;background:#b8322b;color:#fff}
#prycotlinks .request .delete:hover{border-color:#e05249;background:#e05249;color:#fff}
#prycotlinks .request .delete:disabled{opacity:.55}

</style>
<style id="prycot-monochrome-images">img{filter:grayscale(1)!important}.release-cover,.pl-cover-preview,.prycotlink-release-tile img{filter:none!important}</style><style id="prycot-global-button-system">
html body button:not(.menu-button):not([aria-label]),html body input[type="submit"],html body input[type="button"],html body .primary,html body .secondary,html body [class*="btn"],html body [class*="button"]:not(.menu-button),html body [class*="cta"] a{
 box-sizing:border-box!important;min-height:43px!important;padding:15px 30px!important;border-radius:999px!important;
 font-family:Helvetica,Arial,sans-serif!important;font-size:11px!important;font-weight:400!important;line-height:13px!important;
 letter-spacing:.12em!important;text-transform:uppercase!important;vertical-align:middle!important;
}
html body button:not(.menu-button):not([aria-label]),html body input[type="submit"],html body input[type="button"],html body .primary,html body .secondary,html body [class*="btn"],html body [class*="button"]:not(.menu-button),html body [class*="cta"] a{display:inline-flex!important;align-items:center!important;justify-content:center!important}
html body .menu-button,html body button[aria-label]{min-height:0!important;padding:0!important;line-height:normal!important;letter-spacing:normal!important;border-radius:0!important}

<body>
<div class="page">
<div class="brand"><a href="/">PRYCOT.</a><div class="tag">ADMIN / RELEASES</div></div>
<button class="logout hidden" id="logout">Log Out</button>
<main>
<section id="loginView">
<p class="eyebrow">PRYCOT. / ADMIN</p>
<h1>Admin.</h1>
<div class="login"><label for="password">Admin password</label><input id="password" type="password" autocomplete="current-password"><button class="button" id="login">Enter</button><div class="status" id="loginStatus"></div></div>
</section>
<section id="adminView" class="hidden">
<p class="eyebrow">PRYCOT. / ADMIN</p>
<h1 id="pageHeading">Releases.</h1>
<div class="status" id="status"></div>
<div class="tabs" role="tablist" aria-label="Admin content"><button class="tab active" id="tabBot" type="button" role="tab" aria-selected="true">Bot Releases</button><button class="tab" id="tabLinks" type="button" role="tab" aria-selected="false">PRYCOTLINK Pages</button></div>
<div class="toolbar"><span class="count" id="count">0 releases</span><button class="button" id="refresh">Refresh</button></div>
<div id="prycotlinkStats" class="analytics-total hidden" aria-live="polite"><strong id="totalPages">0</strong><span>Total PRYCOTLINK pages created</span></div>
<div id="releases" role="tabpanel"></div><div id="prycotlinks" class="hidden" role="tabpanel"></div>
<footer class="site-footer"><span>PRYCOT. — 2026</span><span>INDEPENDENT MUSIC LABEL</span></footer>
</section>
</main>
</div>
<script>
const WORKER_BASE="https://misty-rain-65f3prycot-release-bot.sorrymoscowwork.workers.dev";
const loginView=document.getElementById("loginView"),adminView=document.getElementById("adminView"),passwordInput=document.getElementById("password"),loginButton=document.getElementById("login"),loginStatus=document.getElementById("loginStatus"),status=document.getElementById("status"),list=document.getElementById("releases"),linksList=document.getElementById("prycotlinks"),count=document.getElementById("count"),logout=document.getElementById("logout"),tabBot=document.getElementById("tabBot"),tabLinks=document.getElementById("tabLinks");
let activeTab="bot";
let adminPassword=sessionStorage.getItem("prycot_admin_password")||"";
function switchTab(tab){activeTab=tab;const isBot=tab==="bot";document.getElementById("pageHeading").textContent=isBot?"Releases.":"PRYCOTLINK Page.";tabBot.classList.toggle("active",isBot);tabLinks.classList.toggle("active",!isBot);tabBot.setAttribute("aria-selected",String(isBot));tabLinks.setAttribute("aria-selected",String(!isBot));list.classList.toggle("hidden",!isBot);linksList.classList.toggle("hidden",isBot);document.getElementById("prycotlinkStats").classList.toggle("hidden",isBot);if(adminPassword){if(isBot)load();else loadPrycotlinks()}}
function setStatus(el,text,error=false){el.textContent=text;el.classList.toggle("error",error)}
function esc(v){return String(v??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#2F2F2F;"}[c]))}
function dateValue(v){if(!v)return "—";const d=new Date(Number(v)*1000);return Number.isNaN(d.getTime())?String(v):d.toLocaleString("en-GB")}
async function api(path,options={}){const headers=Object.assign({"Content-Type":"application/json","X-Admin-Password":adminPassword},options.headers||{});const r=await fetch(WORKER_BASE+path,Object.assign({},options,{headers}));let data={};try{data=await r.json()}catch(_){}if(!r.ok)throw new Error(data.error||"Request failed");return data}
async function load(){setStatus(status,"Loading...");try{const data=await api("/admin/releases");const items=data.releases||[];count.textContent=items.length+" release"+(items.length===1?"":"s");if(!items.length){list.innerHTML='<div class="empty">No releases.</div>';setStatus(status,"");return}list.innerHTML=items.map(r=>`<article class="request"><div class="request-head"><div><div class="title">${esc(r.release_title||"Untitled")}</div><div class="meta">${esc(r.release_type||"")} · ${esc(r.release_date||"—")} · ${esc(r.genre||"")}</div></div></div><div class="body"><div><div class="label">Artist</div><div class="value">${esc(r.artist_name||"—")}</div></div><div><div class="label">User</div><div class="value">${esc(r.firebase_uid||"—")}</div></div><div><div class="label">Telegram</div><div class="value">${esc(r.telegram_chat_id||"—")}</div></div><div><div class="label">Created</div><div class="value">${dateValue(r.created_at)}</div></div></div><div class="controls"><select data-status="${esc(r.id)}"><option value="SUBMITTED" ${r.status==="SUBMITTED"?"selected":""}>SUBMITTED</option><option value="IN REVIEW" ${r.status==="IN REVIEW"?"selected":""}>IN REVIEW</option><option value="SCHEDULED" ${r.status==="SCHEDULED"?"selected":""}>SCHEDULED</option><option value="RELEASED" ${r.status==="RELEASED"?"selected":""}>RELEASED</option></select><button class="save" data-save="${esc(r.id)}">Save Status</button><button class="delete" data-delete-request="${esc(r.id)}">Delete Request</button></div></article>`).join("");list.querySelectorAll("[data-save]").forEach(btn=>btn.addEventListener("click",async()=>{const id=btn.dataset.save;const select=list.querySelector('[data-status="'+CSS.escape(id)+'"]');btn.disabled=true;try{await api("/admin/releases/status",{method:"POST",body:JSON.stringify({id,status:select.value})});setStatus(status,"Status saved.");}catch(e){setStatus(status,e.message,true)}finally{btn.disabled=false}}));list.querySelectorAll("[data-delete-request]").forEach(btn=>btn.addEventListener("click",async()=>{const id=btn.dataset.deleteRequest;if(!confirm("Permanently delete this bot release request? This cannot be undone."))return;btn.disabled=true;try{await api("/admin/releases/delete",{method:"POST",body:JSON.stringify({id})});setStatus(status,"Release request deleted.");await load()}catch(e){setStatus(status,e.message,true);btn.disabled=false}}));setStatus(status,"")}catch(e){setStatus(status,e.message,true)}}
async function loadPrycotlinks(){setStatus(status,"Loading PRYCOTLINK pages...");try{const data=await api("/admin/prycotlinks");const items=data.releases||[];const total=Number.isFinite(Number(data.total_pages))?Number(data.total_pages):items.length;document.getElementById("totalPages").textContent=String(total);count.textContent=total+" total page"+(total===1?"":"s");if(!items.length){linksList.innerHTML='<div class="empty">No PRYCOTLINK pages yet.</div>';setStatus(status,"");return}linksList.innerHTML=items.map(r=>`<article class="request"><div class="request-head"><div><div class="title">${esc(r.title||"Untitled")}</div><div class="meta">${esc(r.artist||"Unknown artist")} · ${esc(r.created_at||"—")}</div></div></div><div class="body"><div><div class="label">Public URL</div><div class="value"><a class="prycotlink-url" href="${esc(r.url||("https://prycot.com/"+r.slug))}" target="_blank" rel="noopener noreferrer">prycot.com/${esc(r.slug||"")}</a></div></div><div><div class="label">YouTube videos</div><div class="value">${Number(r.video_count)||0}</div></div><div><div class="label">Page slug</div><div class="value">${esc(r.slug||"—")}</div></div><div><div class="label">Owner Telegram ID</div><div class="value">${esc(r.owner_telegram_id||"—")}</div></div></div><div class="controls"><button class="delete" data-delete-page="${esc(r.slug||"")}">Delete Page</button></div></article>`).join("");linksList.querySelectorAll("[data-delete-page]").forEach(btn=>btn.addEventListener("click",async()=>{const slug=btn.dataset.deletePage;if(!confirm("Permanently delete PRYCOTLINK page prycot.com/"+slug+"? The public page will stop working. This cannot be undone."))return;btn.disabled=true;try{await api("/admin/prycotlinks/delete",{method:"POST",body:JSON.stringify({slug})});setStatus(status,"PRYCOTLINK page deleted.");await loadPrycotlinks()}catch(e){setStatus(status,e.message,true);btn.disabled=false}}));setStatus(status,"")}catch(e){setStatus(status,e.message,true)}}
async function enter(){const p=passwordInput.value;if(!p){setStatus(loginStatus,"Enter the password.",true);return}loginButton.disabled=true;setStatus(loginStatus,"Checking...");try{const r=await fetch(WORKER_BASE+"/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:p})});const data=await r.json();if(!r.ok||!data.authorized)throw new Error(data.error||"Access denied.");adminPassword=p;sessionStorage.setItem("prycot_admin_password",p);loginView.classList.add("hidden");adminView.classList.remove("hidden");logout.classList.remove("hidden");await load()}catch(e){setStatus(loginStatus,e.message||"Access denied.",true)}finally{loginButton.disabled=false}}
loginButton.onclick=enter;passwordInput.addEventListener("keydown",e=>{if(e.key==="Enter")enter()});tabBot.onclick=()=>switchTab("bot");tabLinks.onclick=()=>switchTab("links");document.getElementById("refresh").onclick=()=>activeTab==="bot"?load():loadPrycotlinks();logout.onclick=()=>{sessionStorage.removeItem("prycot_admin_password");adminPassword="";location.reload()};
if(adminPassword){loginView.classList.add("hidden");adminView.classList.remove("hidden");logout.classList.remove("hidden");load().catch(()=>{sessionStorage.removeItem("prycot_admin_password");location.reload()})}
</script>
  <script src="/site-navigation.js?v=20261022-desktop-size2" defer></script>
</body>
</html>
