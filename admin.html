<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRYCOT. — Admin</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#0a0a0a;--fg:#f4f4f2;--muted:#9b9b98;--line:#292929;--accent:#A0522D;--hover:#FF7F50;--error:#d97878}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}button,input,select{font:inherit}.page{min-height:100vh;padding:30px 34px 50px}.brand{position:fixed;top:30px;left:34px;z-index:20;font-size:clamp(34px,4.5vw,62px);line-height:.82;font-weight:800;font-style:italic;letter-spacing:-.075em}.brand a{color:inherit;text-decoration:none}.tag{margin-top:72px;color:var(--muted);font-size:9px;letter-spacing:.11em;text-transform:uppercase}.logout{position:fixed;top:28px;right:34px;border:1px solid #3a3a3a;border-radius:999px;background:transparent;color:var(--fg);padding:9px 18px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.logout:hover{border-color:var(--fg)}main{max-width:1180px;margin:18vh auto 0}h1{margin:0;font-size:clamp(42px,6vw,78px);line-height:.96;font-weight:500;letter-spacing:-.05em}.eyebrow{margin:0 0 18px;color:var(--muted);font-size:10px;letter-spacing:.14em;text-transform:uppercase}.status{min-height:20px;margin:20px 0;color:var(--muted);font-size:12px}.error{color:var(--error)}.hidden{display:none!important}.login{max-width:460px;margin-top:36px;border-top:1px solid var(--line);padding-top:24px}.login label{display:block;margin-bottom:10px;color:var(--muted);font-size:10px;letter-spacing:.14em;text-transform:uppercase}.login input{width:100%;border:0;border-bottom:1px solid #3a3a3a;background:transparent;color:var(--fg);padding:11px 0;font-size:15px;outline:none}.login input:focus{border-color:var(--fg)}.button{margin-top:22px;border:0;border-radius:999px;background:var(--accent);color:#fff;padding:9px 18px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.button:hover{background:var(--hover);color:#000}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:42px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 0}.count{color:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase}.request{border-bottom:1px solid var(--line);padding:24px 0}.request-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.title{font-size:20px;letter-spacing:-.02em}.meta{margin-top:8px;color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase}.body{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 40px;margin-top:20px}.label{color:var(--muted);font-size:9px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:7px}.value{font-size:13px;line-height:1.5;word-break:break-word}.controls{margin-top:22px;display:flex;gap:10px;align-items:center}.controls select{border:1px solid #3a3a3a;border-radius:999px;background:#0a0a0a;color:var(--fg);padding:8px 14px;font-size:10px;letter-spacing:.08em;text-transform:uppercase}.save{border:0;border-radius:999px;background:var(--accent);color:#fff;padding:9px 18px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.save:hover{background:var(--hover);color:#000}.empty{padding:30px 0;color:var(--muted);font-size:13px}.site-footer{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:80px;padding-top:22px;border-top:1px solid var(--line);color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase}@media(max-width:700px){.page{padding:22px 20px}.brand{top:22px;left:20px;font-size:42px}.logout{top:20px;right:20px}.tag{margin-top:48px}.body{grid-template-columns:1fr}.request-head{flex-direction:column}main{margin-top:15vh}.site-footer{margin-top:56px;padding-top:18px;font-size:8px;white-space:nowrap}.controls{flex-wrap:wrap}}

/* Unified pill shape for interactive buttons across desktop and mobile */
button:not(.menu-button),input[type="submit"],input[type="button"],.primary,.secondary,[class*="btn"],[class*="button"]:not(.menu-button),[class*="cta"]{border-radius:999px!important}.menu-button{border-radius:0!important}
</style>
</head>
<body>
<div class="page">
<div class="brand"><a href="/">PRYCOT.</a><div class="tag">ADMIN / RELEASES</div></div>
<button class="logout hidden" id="logout">Log Out</button>
<main>
<section id="loginView">
<p class="eyebrow">PRYCOT. / ADMIN</p>
<h1>Admin.</h1>
<div class="login"><label for="password">Admin password</label><input id="password" type="password" autocomplete="current-password"><button class="button" id="login">Enter</button><div class="status" id="loginStatus"></div></div>
</section>
<section id="adminView" class="hidden">
<p class="eyebrow">PRYCOT. / ADMIN</p>
<h1>Releases.</h1>
<div class="status" id="status"></div>
<div class="toolbar"><span class="count" id="count">0 releases</span><button class="button" id="refresh">Refresh</button></div>
<div id="releases"></div>
<footer class="site-footer"><span>PRYCOT. — 2026</span><span>INDEPENDENT MUSIC LABEL</span></footer>
</section>
</main>
</div>
<script>
const WORKER_BASE="https://misty-rain-65f3prycot-release-bot.sorrymoscowwork.workers.dev";
const loginView=document.getElementById("loginView"),adminView=document.getElementById("adminView"),passwordInput=document.getElementById("password"),loginButton=document.getElementById("login"),loginStatus=document.getElementById("loginStatus"),status=document.getElementById("status"),list=document.getElementById("releases"),count=document.getElementById("count"),logout=document.getElementById("logout");
let adminPassword=sessionStorage.getItem("prycot_admin_password")||"";
function setStatus(el,text,error=false){el.textContent=text;el.classList.toggle("error",error)}
function esc(v){return String(v??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}
function dateValue(v){if(!v)return "—";const d=new Date(Number(v)*1000);return Number.isNaN(d.getTime())?String(v):d.toLocaleString("en-GB")}
async function api(path,options={}){const headers=Object.assign({"Content-Type":"application/json","X-Admin-Password":adminPassword},options.headers||{});const r=await fetch(WORKER_BASE+path,Object.assign({},options,{headers}));let data={};try{data=await r.json()}catch(_){}if(!r.ok)throw new Error(data.error||"Request failed");return data}
async function load(){setStatus(status,"Loading...");try{const data=await api("/admin/releases");const items=data.releases||[];count.textContent=items.length+" release"+(items.length===1?"":"s");if(!items.length){list.innerHTML='<div class="empty">No releases.</div>';setStatus(status,"");return}list.innerHTML=items.map(r=>`<article class="request"><div class="request-head"><div><div class="title">${esc(r.release_title||"Untitled")}</div><div class="meta">${esc(r.release_type||"")} · ${esc(r.release_date||"—")} · ${esc(r.genre||"")}</div></div></div><div class="body"><div><div class="label">Artist</div><div class="value">${esc(r.artist_name||"—")}</div></div><div><div class="label">User</div><div class="value">${esc(r.firebase_uid||"—")}</div></div><div><div class="label">Telegram</div><div class="value">${esc(r.telegram_chat_id||"—")}</div></div><div><div class="label">Created</div><div class="value">${dateValue(r.created_at)}</div></div></div><div class="controls"><select data-status="${esc(r.id)}"><option value="SUBMITTED" ${r.status==="SUBMITTED"?"selected":""}>SUBMITTED</option><option value="IN REVIEW" ${r.status==="IN REVIEW"?"selected":""}>IN REVIEW</option><option value="SCHEDULED" ${r.status==="SCHEDULED"?"selected":""}>SCHEDULED</option><option value="RELEASED" ${r.status==="RELEASED"?"selected":""}>RELEASED</option></select><button class="save" data-save="${esc(r.id)}">Save Status</button></div></article>`).join("");list.querySelectorAll("[data-save]").forEach(btn=>btn.addEventListener("click",async()=>{const id=btn.dataset.save;const select=list.querySelector('[data-status="'+CSS.escape(id)+'"]');btn.disabled=true;try{await api("/admin/releases/status",{method:"POST",body:JSON.stringify({id,status:select.value})});setStatus(status,"Status saved.");}catch(e){setStatus(status,e.message,true)}finally{btn.disabled=false}}));setStatus(status,"")}catch(e){setStatus(status,e.message,true)}}
async function enter(){const p=passwordInput.value;if(!p){setStatus(loginStatus,"Enter the password.",true);return}loginButton.disabled=true;setStatus(loginStatus,"Checking...");try{const r=await fetch(WORKER_BASE+"/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:p})});const data=await r.json();if(!r.ok||!data.authorized)throw new Error(data.error||"Access denied.");adminPassword=p;sessionStorage.setItem("prycot_admin_password",p);loginView.classList.add("hidden");adminView.classList.remove("hidden");logout.classList.remove("hidden");await load()}catch(e){setStatus(loginStatus,e.message||"Access denied.",true)}finally{loginButton.disabled=false}}
loginButton.onclick=enter;passwordInput.addEventListener("keydown",e=>{if(e.key==="Enter")enter()});document.getElementById("refresh").onclick=load;logout.onclick=()=>{sessionStorage.removeItem("prycot_admin_password");adminPassword="";location.reload()};
if(adminPassword){loginView.classList.add("hidden");adminView.classList.remove("hidden");logout.classList.remove("hidden");load().catch(()=>{sessionStorage.removeItem("prycot_admin_password");location.reload()})}
</script>
</body>
</html>
