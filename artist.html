<div class="page">

<section class="profile hidden" id="profile">
<div class="avatar" id="avatar"></div>
<div class="name" id="name"></div>

<a class="telegram" id="telegram" target="_blank" rel="noopener"></a>
</section>
<section class="not-found hidden" id="notFound"><h1>Profile not found.</h1><p>This artist profile is not available.</p></section>
</main>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyCrU93d-F-WUX4GbuoPSFgdf9bOgSbQlBY",authDomain:"prycot-fe79e.firebaseapp.com",projectId:"prycot-fe79e",storageBucket:"prycot-fe79e.firebasestorage.app",messagingSenderId:"566283099923",appId:"1:566283099923:web:b42c4eea5ca42e4144c4e6"});
const db=firebase.firestore();
const username=(new URLSearchParams(location.search).get("u")||"").toLowerCase();
function initials(name){return(name||"A").trim().split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase()||"A"}
async function load(){
if(!/^[a-z0-9_]{3,20}$/.test(username)){document.getElementById("notFound").classList.remove("hidden");return}
try{
const snap=await db.collection("publicProfiles").doc(username).get();
if(!snap.exists||snap.data().public!==true){document.getElementById("notFound").classList.remove("hidden");return}
const d=snap.data();
document.getElementById("name").textContent=d.displayName||username;
document.getElementById("bio").textContent=d.bio||"";
const av=document.getElementById("avatar");av.textContent=initials(d.displayName||username);
if(d.telegram){
const t=d.telegram.startsWith("@")?d.telegram.slice(1):d.telegram;
document.getElementById("telegram").href="https://t.me/"+encodeURIComponent(t);
document.getElementById("telegram").textContent=d.telegram;
}else document.getElementById("telegram").classList.add("hidden");
document.getElementById("profile").classList.remove("hidden");
}catch(e){document.getElementById("notFound").classList.remove("hidden")}
}
load();
</script>

</nav></div><button class="menu-button" id="menuButton" type="button" aria-label="Open menu" aria-expanded="false"><span></span></button><script id="canonical-menu-behavior">
const menu=document.getElementById('menu'),menuButton=document.getElementById('menuButton');
if(menu&&menuButton){
 const closeMenu=()=>{menu.classList.remove('open');menuButton.setAttribute('aria-expanded','false')};
 menuButton.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();menu.classList.toggle('open');menuButton.setAttribute('aria-expanded',menu.classList.contains('open'))});
 document.addEventListener('click',e=>{if(menu.classList.contains('open')&&!menu.contains(e.target)&&e.target!==menuButton)closeMenu()});
}
document.querySelectorAll('.menu-links a').forEach(link=>{
 const current=(location.pathname.split('/').pop()||'index.html').toLowerCase();
 const target=(link.getAttribute('href').split('/').pop()||'index.html').toLowerCase();
 if((current==='index.html'&&target==='index.html')||current===target) link.classList.add('active-page');
});
