<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRYCOT. — Not Just Distribution</title>
<meta name="description" content="PRYCOT. began with distribution, but music was always the reason behind it. A note on the idea, the work and the people behind PRYCOT.">
<style>:root{--bg:#0a0a0a;--fg:#f4f4f2;--muted:#9b9b98;--line:#292929;--accent:#A0522D;--accent-hover:#FF7F50}
*{box-sizing:border-box}
button,a{cursor:pointer!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.page{min-height:100vh;padding:30px 34px 42px}
header{position:relative;min-height:0}
.brand{position:fixed;top:30px;left:34px;z-index:20;transition:opacity .56s ease,filter .56s ease,transform .56s ease}.logo{margin:0;font-size:clamp(34px,4.5vw,62px);line-height:.82;font-weight:800;font-style:italic;letter-spacing:-.075em}.tagline{position:fixed;top:88px;left:42px;margin:0;display:flex;flex-direction:column;font-family:Helvetica,Arial,sans-serif;font-size:9px;line-height:1.18;font-weight:500;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);z-index:20;transition:opacity .56s ease,filter .56s ease,transform .56s ease}.tagline a{display:block;font:inherit;color:inherit;text-decoration:none}.menu-button{position:fixed;top:28px;right:34px;width:28px;height:22px;border:0;background:none;padding:0;z-index:21}.menu-button span,.menu-button span:before,.menu-button span:after{position:absolute;left:0;width:28px;height:1px;background:var(--fg);content:""}.menu-button span{top:10px}.menu-button span:before{top:-7px}.menu-button span:after{top:7px}.menu{position:fixed;inset:0 0 0 auto;z-index:10;display:none;width:min(33.333vw,520px);background:rgba(10,10,10,.22);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-left:1px solid rgba(244,244,242,.16);padding:30px 34px 42px}.menu.open{display:flex}.menu-links{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:42px;align-items:center}.menu-column{display:flex;flex-direction:column;align-items:flex-start;gap:18px}.menu-links a{font-family:Helvetica,Arial,sans-serif;font-size:18px;line-height:1.1;font-weight:500;color:var(--fg);text-decoration:none}.menu-links a:hover{color:var(--accent-hover)}.active-page{color:var(--accent)!important;font-style:italic}
.content{max-width:760px;margin:calc(14vh + 56px) auto 0}.eyebrow{margin:0 0 22px;color:var(--muted);font-size:10px;letter-spacing:.14em;text-transform:uppercase}.content h1{margin:0 0 30px;max-width:760px;font-size:clamp(48px,7vw,88px);line-height:.94;font-weight:500;letter-spacing:-.055em}.meta{margin:0 0 62px;color:var(--muted);font-size:10px;letter-spacing:.14em;text-transform:uppercase}.article{font-size:17px;line-height:1.72}.article p{margin:0 0 16px}.article h2{margin:44px 0 16px;font-size:28px;line-height:1.05;font-weight:500;letter-spacing:-.035em}.back{display:inline-block;margin-top:42px;color:var(--muted);font-size:10px;letter-spacing:.14em;text-transform:uppercase}.back:hover{color:var(--accent-hover)}footer{display:flex;justify-content:space-between;gap:20px;margin-top:100px;padding-top:22px;border-top:1px solid var(--line);color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase}@media(max-width:700px){.page{padding:22px 20px 30px}.brand{top:22px;left:20px}.logo{font-size:42px;max-width:calc(100vw - 92px);white-space:nowrap}.tagline{top:62px;left:28px;font-size:8px;line-height:1.18;letter-spacing:.11em}.menu-button{top:20px;right:20px}.menu{width:50vw;max-width:50vw;min-width:50vw;padding:22px 14px 28px}.menu-links{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:0;width:100%}.menu-column{width:100%;gap:0}.menu-column a{display:block;width:100%;margin:0 0 18px;font-size:13px;line-height:1.05;white-space:nowrap}.menu-right{margin-top:18px;padding-top:18px;border-top:1px solid rgba(244,244,242,.28)}.content{margin:calc(12vh + 46px) auto 0}.content h1{font-size:44px}.meta{margin-bottom:42px}.article{font-size:16px;line-height:1.68}.article h2{font-size:25px;margin-top:36px}footer{flex-direction:column;gap:8px;margin-top:70px;padding-top:18px;font-size:8px;white-space:nowrap}}
<script>const menu=document.getElementById('menu'),btn=document.getElementById('menuButton');btn.addEventListener('click',e=>{e.preventDefault();menu.classList.toggle('open');btn.setAttribute('aria-expanded',menu.classList.contains('open'))});document.addEventListener('click',e=>{if(menu.classList.contains('open')&&!menu.contains(e.target)&&e.target!==btn){menu.classList.remove('open');btn.setAttribute('aria-expanded','false')}});let lastY=window.scrollY;window.addEventListener('scroll',()=>{if(window.innerWidth<=700){const y=window.scrollY,atTop=y<=24;const brand=document.querySelector('.brand'),tagline=document.querySelector('.tagline');const visible=atTop;brand.style.opacity=visible?'1':'0';tagline.style.opacity=visible?'1':'0';brand.style.filter=visible?'blur(0)':'blur(8px)';tagline.style.filter=visible?'blur(0)':'blur(8px)';brand.style.transform=visible?'translateY(0)':'translateY(-8px)';tagline.style.transform=visible?'translateY(0)':'translateY(-8px)';lastY=y}}, {passive:true});</script>
</body></html>
