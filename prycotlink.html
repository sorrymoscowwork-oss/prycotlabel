<script>
const menu=document.getElementById('menu'),menuButton=document.getElementById('menuButton');
const closeMenu=()=>{menu.classList.remove('open');menuButton.setAttribute('aria-expanded','false')};
menuButton.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();menu.classList.toggle('open');menuButton.setAttribute('aria-expanded',menu.classList.contains('open'))});
document.addEventListener('click',e=>{if(menu.classList.contains('open')&&!menu.contains(e.target)&&e.target!==menuButton)closeMenu()});
document.querySelectorAll('.menu-links a').forEach(link=>{
 const current=(location.pathname.split('/').pop()||'index.html').toLowerCase();
 const target=(link.getAttribute('href').split('/').pop()||'index.html').toLowerCase();
 if((current==='index.html'&&target==='index.html')||current===target)link.classList.add('active-page');
});
</script>
<script id="mobile-logo-tagline-scroll-final-js">(function(){const brand=document.querySelector('.brand'),tagline=document.querySelector('.tagline');if(!brand||!tagline)return;const page=document.querySelector('.page')||document.body;let ticking=false;function update(){if(innerWidth>700){page.classList.remove('mobile-brand-hidden');ticking=false;return}page.classList.toggle('mobile-brand-hidden',scrollY>80);ticking=false}addEventListener('scroll',function(){if(!ticking){requestAnimationFrame(update);ticking=true}},{passive:true});addEventListener('resize',update);update()})();</script><script id="mobile-burger-controller-v2">(function(){const btn=document.getElementById('menuButton'),menu=document.getElementById('menu');if(!btn||!menu)return;document.addEventListener('click',function(e){if(window.innerWidth>700)return;if(btn.contains(e.target)){e.preventDefault();e.stopImmediatePropagation();menu.classList.toggle('open');btn.setAttribute('aria-expanded',menu.classList.contains('open'));return}if(menu.classList.contains('open')&&!menu.contains(e.target)){e.preventDefault();e.stopImmediatePropagation();menu.classList.remove('open');btn.setAttribute('aria-expanded','false')}},true)})();</script></body>
