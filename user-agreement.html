<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRYCOT. — User Agreement</title>
<style>
:root{--bg:#0a0a0a;--fg:#f4f4f2;--muted:#9b9b98;--line:#292929}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,a{cursor:pointer!important}
.page{min-height:100vh;padding:30px 34px 42px}
.brand{position:fixed;top:30px;left:34px;z-index:20}
.logo{margin:0;font-size:clamp(34px,4.5vw,62px);line-height:.82;font-weight:800;font-style:italic;letter-spacing:-.075em}
.tagline{position:fixed;top:88px;left:42px;display:flex;flex-direction:column;font-size:9px;line-height:1.18;font-weight:500;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);z-index:20}
.tagline a{display:block}
.menu-button{position:fixed;top:28px;right:34px;width:28px;height:22px;border:0;background:none;color:var(--fg);padding:0;z-index:21}
.menu-button span,.menu-button span:before,.menu-button span:after{position:absolute;left:0;width:28px;height:1px;background:var(--fg);content:""}
.menu-button span{top:10px}.menu-button span:before{top:-7px}.menu-button span:after{top:7px}
.menu{position:fixed;inset:0 0 0 auto;z-index:10;display:none;width:min(33.333vw,520px);background:rgba(10,10,10,.22);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-left:1px solid rgba(244,244,242,.16);padding:30px 34px 42px}
.menu.open{display:flex;flex-direction:column}
.menu-links{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:42px;align-items:center;text-align:left}
.menu-column{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:18px}
.menu-links a{font-size:18px;line-height:1.1;letter-spacing:-.02em;font-weight:500;color:#f4f4f2;font-style:normal}
.menu-left a:nth-child(1),.menu-left a:nth-child(2),.menu-right a{color:#A0522D}
.menu-links a:hover{color:#FF7F50}
.menu-links a.active-page{color:#A0522D;font-style:italic}
.content{max-width:920px;margin:14vh auto 0}
.eyebrow{margin:0 0 22px;color:var(--muted);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
h2{max-width:780px;margin:0;font-size:clamp(38px,6vw,78px);line-height:.96;font-weight:500;letter-spacing:-.05em}
footer{display:flex;justify-content:space-between;gap:20px;margin-top:80px;padding-top:22px;border-top:1px solid var(--line);color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
@media(max-width:700px){
.page{padding:22px 20px 30px}
.logo{font-size:42px}
.tagline{top:62px;left:28px;font-size:8px}
.menu-button{top:20px;right:20px}
.menu{inset:0;width:100%;padding:22px 20px 30px}
.menu-links{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:0}
.menu-column{gap:18px}
.menu-right{margin-top:18px}
.content{margin-top:12vh}
footer{flex-direction:column;gap:8px}
}
</style>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/site.webmanifest">
</head>
<body>
<div class="menu" id="menu">
<nav class="menu-links" aria-label="Site navigation">
<div class="menu-column menu-left">
<a href="/">Home</a>
<a href="account.html">Account</a>
<a href="about.html">About PRYCOT.</a>
<a href="terms.html">Release Terms</a>
<a href="how-to-release.html">How to Release</a>
<a href="telegram-bot.html">Telegram Bot Guide</a>
<a href="prices.html">Prices</a>
<a href="label-services.html">Label Services</a>
<a href="contact.html">Contact</a>
</div>
<div class="menu-column menu-right">
<a href="blog.html">Blog</a>
<a href="side-projects.html">Side Projects</a>
<a href="white-paper.html">White Paper</a>
<a href="user-agreement.html">User Agreement</a>
</div>
</nav>
</div>
<main class="page">
<a class="brand" href="/" aria-label="PRYCOT."><h1 class="logo">PRYCOT.</h1></a>
<p class="tagline"><a href="/">RELEASE WORLDWIDE.</a><a href="/">PAY IN CRYPTO.</a><a href="/">ROYALTIES IN CRYPTO.</a></p>
<button class="menu-button" id="menuButton" type="button" aria-label="Open menu" aria-expanded="false"><span></span></button>
<section class="content">
<p class="eyebrow">PRYCOT. / USER AGREEMENT</p>
<h2>User Agreement.</h2>
</section>
<footer><span>PRYCOT. — 2026</span><span>Independent music label</span></footer>
</main>
<script>
const menu=document.getElementById('menu'),menuButton=document.getElementById('menuButton');
const closeMenu=()=>{menu.classList.remove('open');menuButton.setAttribute('aria-expanded','false')};
menuButton.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();menu.classList.toggle('open');menuButton.setAttribute('aria-expanded',menu.classList.contains('open'))});
document.addEventListener('click',e=>{if(menu.classList.contains('open')&&!menu.contains(e.target)&&e.target!==menuButton)closeMenu()});
document.querySelectorAll('.menu-links a').forEach(link=>{
 const current=(location.pathname.split('/').pop()||'index.html').toLowerCase();
 const target=(link.getAttribute('href').split('/').pop()||'index.html').toLowerCase();
 if((current==='index.html'&&target==='index.html')||current===target)link.classList.add('active-page');
});
</script>
</body>
</html>
